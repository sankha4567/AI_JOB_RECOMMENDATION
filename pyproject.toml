[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-recommender"
version = "0.2.0"
description = "AI-powered job recommendation system using Gemini, LangChain and ChromaDB"
requires-python = ">=3.11"
dependencies = [
    "langchain==0.3.27",
    "langchain-community==0.3.27",
    "langchain-google-genai==2.1.9",
    "langchain-chroma==0.2.5",
    "langchain-huggingface==0.3.1",
    "sentence-transformers",
    "chromadb==1.0.20",
    "pydantic==2.11.7",
    "pydantic-settings>=2.0.0",
    "python-dotenv==1.1.1",
    "pypdf==6.0.0",
    "requests==2.32.5",
    "streamlit>=1.40.0",
]

[project.scripts]
sync-jobs = "scripts.sync_jobs:main"

[tool.setuptools.packages.find]
where = ["src"]